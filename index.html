<!doctype html>
<html lang="lv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma trousse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7f2; --surface:#ffffff; --surface2:#fdeee6; --ink:#2b2140; --muted:#6f6687; --line:#f0dcd2;
  --accent:#ef476f; --accent2:#118ab2; --ok:#06966b; --ok-bg:#dcf5ea; --bad:#d62839; --bad-bg:#fde3e6;
  --m:#1f6fd6; --f:#d6336c; --pl:#8a3fd1; --gold:#e09f00; --card:#fffdf8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17142a; --surface:#221e3a; --surface2:#2c2748; --ink:#f4f0ff; --muted:#aaa2c8; --line:#3a345e;
    --accent:#ff6b8d; --accent2:#4cc3e8; --ok:#3fd69b; --ok-bg:#163a2c; --bad:#ff6b7a; --bad-bg:#40202a;
    --m:#6aa8ff; --f:#ff7aa6; --pl:#c18bff; --gold:#ffc53d; --card:#fbf7ef;
  }
}
:root[data-theme="dark"]{
  --bg:#17142a; --surface:#221e3a; --surface2:#2c2748; --ink:#f4f0ff; --muted:#aaa2c8; --line:#3a345e;
  --accent:#ff6b8d; --accent2:#4cc3e8; --ok:#3fd69b; --ok-bg:#163a2c; --bad:#ff6b7a; --bad-bg:#40202a;
  --m:#6aa8ff; --f:#ff7aa6; --pl:#c18bff; --gold:#ffc53d; --card:#fbf7ef;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Baloo 2',system-ui,-apple-system,sans-serif;font-size:19px;line-height:1.4}
.wrap{max-width:760px;margin:0 auto;padding:10px 16px 90px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 0 12px;border-bottom:2px solid var(--line);margin-bottom:14px}
header h1{font-size:24px;margin:0;flex:1;cursor:pointer;white-space:nowrap}
.flag{display:inline-block;width:26px;height:18px;border-radius:3px;background:linear-gradient(90deg,#0055a4 33%,#fff 33% 66%,#ef4135 66%);vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px var(--line)}
.pill{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-weight:800;font-size:17px}
.btn{font:inherit;font-weight:800;border-radius:14px;padding:8px 18px;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--line)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.small{padding:4px 12px;font-size:16px;border-radius:10px}
.btn:active{transform:scale(.97)}
h2{font-size:25px;margin:6px 0 8px}
.muted{color:var(--muted)}
.small{font-size:15px}
.hero{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;margin-bottom:14px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:14px 16px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.tile:hover{border-color:var(--accent)}
.tile .ico{font-size:32px;line-height:1.1}
.tile .t{font-weight:800;font-size:20px}
.tile .s{color:var(--muted);font-size:15px;line-height:1.3}
.tile.wide{grid-column:1/-1}
.tile.test{border-color:var(--accent);border-style:dashed}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.topbar h2{margin:0;flex:1}
details.lesson{background:var(--surface2);border-radius:14px;padding:8px 14px;margin:6px 0 12px}
details.lesson summary{cursor:pointer;font-weight:800}
details.lesson ul{padding-left:22px;margin:6px 0}
details.lesson li{margin:3px 0}
.fr{font-weight:800}
.gm{color:var(--m);font-weight:800}.gf{color:var(--f);font-weight:800}.gp{color:var(--pl);font-weight:800}
.task{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px 16px 16px;margin-bottom:14px}
.progress{display:flex;justify-content:space-between;font-weight:800;color:var(--muted);font-size:16px;margin-bottom:4px}
.pbar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden;margin-bottom:10px}
.pbar>i{display:block;height:100%;background:var(--accent);transition:width .4s}
.kind{font-weight:800;color:var(--muted);text-transform:uppercase;font-size:13px;letter-spacing:.07em}
.prompt{font-size:24px;font-weight:800;margin:4px 0 8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.say{font:inherit;border:2px solid var(--line);background:var(--surface2);border-radius:999px;width:42px;height:42px;cursor:pointer;font-size:19px;flex:none}
.pic{width:150px;height:150px;margin:4px auto 10px;background:var(--card);border-radius:22px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center}
.pic svg{width:120px;height:120px}
.pic.two{width:190px}.pic.two svg{width:84px;height:84px;margin:0 -4px}
.swatch-big{width:120px;height:120px;border-radius:50%;margin:6px auto 12px;border:4px solid var(--line);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.opt{font:inherit;font-size:21px;font-weight:700;padding:10px 12px;border-radius:16px;border:2px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;text-align:center}
.opt:hover:not(:disabled){border-color:var(--accent2)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.opt:disabled{cursor:default}
.swopts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sw{width:72px;height:72px;border-radius:50%;border:4px solid var(--line);cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.sw.right{outline:5px solid var(--ok);outline-offset:3px}
.sw.wrong{outline:5px solid var(--bad);outline-offset:3px;opacity:.6}
.typebox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.typebox .pre{font-size:22px;font-weight:800}
.typebox input{font:inherit;font-size:22px;font-weight:700;padding:8px 12px;border-radius:14px;border:3px solid var(--accent2);background:var(--bg);color:var(--ink);min-width:0;flex:1;max-width:320px}
.typebox input.okk{border-color:var(--ok)}.typebox input.bad{border-color:var(--bad)}
.accents{display:flex;gap:6px;margin:8px 0}
.accents button{font:inherit;font-size:20px;font-weight:800;width:44px;height:40px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.line{min-height:56px;border:3px dashed var(--accent2);border-radius:16px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.wt{font:inherit;font-size:20px;font-weight:800;padding:6px 14px;border-radius:12px;border:2px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer}
.wt.used{visibility:hidden}
.fb{border-radius:16px;padding:10px 14px;margin-top:12px;font-size:18px}
.fb.ok{background:var(--ok-bg)}.fb.bad{background:var(--bad-bg)}.fb.tip{background:var(--surface2)}
.actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.done{background:var(--ok-bg);border-radius:20px;padding:16px;text-align:center;margin-bottom:14px}
.done .big{font-size:42px;font-weight:800}
table.res{width:100%;border-collapse:collapse;margin:10px 0;font-size:17px}
table.res th,table.res td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.res td.c{text-align:center}
.tag{display:inline-block;border-radius:8px;padding:0 8px;font-weight:800;font-size:15px}
.tag.g{background:var(--ok-bg);color:var(--ok)}.tag.y{background:#fff1c2;color:#6b5200}.tag.r{background:var(--bad-bg);color:var(--bad)}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:8px;text-align:center;cursor:pointer;font:inherit;color:inherit}
.card .pic{width:96px;height:96px;margin:2px auto 4px;border-radius:16px}
.card .pic svg{width:78px;height:78px}
.card .w{font-weight:800;font-size:19px;line-height:1.2}
.card .lv{color:var(--muted);font-size:15px}
.colrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.colcard{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit;text-align:left}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid var(--line);flex:none}
.trousse{background:linear-gradient(135deg,var(--surface2),var(--surface));border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin-bottom:14px}
.trousse .row{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0;min-height:52px;background:var(--card);border-radius:14px;padding:4px}
.trousse .row svg{width:46px;height:46px}
.bar{height:12px;background:var(--surface);border-radius:999px;overflow:hidden;border:2px solid var(--line);margin:4px 0}
.bar>i{display:block;height:100%;background:var(--gold)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:16px;font-weight:800;z-index:50;max-width:90vw;text-align:center;animation:up .3s}
@keyframes up{from{transform:translate(-50%,120%)}}
.confetti{position:fixed;top:-40px;font-size:28px;z-index:40;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (max-width:480px){.prompt{font-size:21px}.opt{font-size:19px}header h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="home"><span class="flag"></span>Ma trousse</h1>
    <span class="pill" id="stars">⭐ 0</span>
    <button class="btn small" id="snd">🔊</button>
  </header>
  <main id="main"></main>
</div>
<script>
/* ============ palīgi ============ */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function el(t,c,txt){const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e;}
function btn(t,c,f){const b=el('button','btn '+(c||''),t);b.onclick=f;return b;}
const store={get(k,d){try{const v=localStorage.getItem('frtr_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('frtr_'+k,JSON.stringify(v));}catch(e){}}};
const S={stars:store.get('stars',0),sound:store.get('sound',true),mist:store.get('mist',[]),tests:store.get('tests',[]),seen:store.get('seen',false),stats:store.get('stats',{})};
function save(){for(const k in S)store.set(k,S[k]);}

/* ============ balss ============ */
let frVoice=null;
function loadVoices(){try{const vs=speechSynthesis.getVoices();frVoice=vs.find(v=>/^fr/i.test(v.lang)&&/Amélie|Thomas|Google|Audrey|Marie/i.test(v.name))||vs.find(v=>/^fr/i.test(v.lang))||null;}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices;}
function say(t){if(!S.sound||!t||!('speechSynthesis' in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='fr-FR';if(frVoice)u.voice=frVoice;u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
function sayBtn(t){const b=el('button','say','🔊');b.title='Klausīties';b.onclick=e=>{e.stopPropagation();const s=S.sound;S.sound=true;say(t);S.sound=s;};return b;}

/* ============ dati (pēc skolas burtnīcas) ============ */
// c: 'school' — skolas lietas, 'class' — klasē
const ITEMS=[
 {w:'sac',pl:'sacs',g:'m',lv:'soma',lvpl:'somas',lg:'f',c:'school'},
 {w:'sac à dos',pl:'sacs à dos',g:'m',lv:'mugursoma',lvpl:'mugursomas',lg:'f',c:'school'},
 {w:'livre',pl:'livres',g:'m',lv:'grāmata',lvpl:'grāmatas',lg:'f',c:'school'},
 {w:'cahier',pl:'cahiers',g:'m',lv:'burtnīca',lvpl:'burtnīcas',lg:'f',c:'school'},
 {w:'crayon',pl:'crayons',g:'m',lv:'zīmulis',lvpl:'zīmuļi',lg:'m',c:'school'},
 {w:'stylo',pl:'stylos',g:'m',lv:'pildspalva',lvpl:'pildspalvas',lg:'f',c:'school'},
 {w:'feutre',pl:'feutres',g:'m',lv:'flomasters',lvpl:'flomasteri',lg:'m',c:'school'},
 {w:'taille-crayon',pl:'taille-crayons',g:'m',lv:'zīmuļu asināmais',lvpl:'zīmuļu asināmie',lg:'m',c:'school'},
 {w:'trousse',pl:'trousses',g:'f',lv:'penālis',lvpl:'penāļi',lg:'m',c:'school'},
 {w:'gomme',pl:'gommes',g:'f',lv:'dzēšgumija',lvpl:'dzēšgumijas',lg:'f',c:'school'},
 {w:'règle',pl:'règles',g:'f',lv:'lineāls',lvpl:'lineāli',lg:'m',c:'school'},
 {w:'colle',pl:'colles',g:'f',lv:'līme',lvpl:'līmes',lg:'f',c:'school'},
 {w:'ciseaux',pl:'ciseaux',g:'m',lv:'šķēres',lvpl:'šķēres',lg:'f',c:'school',onlyPl:true},
 {w:'classe',pl:'classes',g:'f',lv:'klase',lvpl:'klases',lg:'f',c:'class'},
 {w:'tableau',pl:'tableaux',g:'m',lv:'tāfele',lvpl:'tāfeles',lg:'f',c:'class'},
 {w:'tableau interactif',pl:'tableaux interactifs',g:'m',lv:'interaktīvā tāfele',lvpl:'interaktīvās tāfeles',lg:'f',c:'class'},
 {w:'table',pl:'tables',g:'f',lv:'galds',lvpl:'galdi',lg:'m',c:'class'},
 {w:'chaise',pl:'chaises',g:'f',lv:'krēsls',lvpl:'krēsli',lg:'m',c:'class'},
 {w:'corbeille',pl:'corbeilles',g:'f',lv:'miskaste',lvpl:'miskastes',lg:'f',c:'class'}];
const IT=Object.fromEntries(ITEMS.map(i=>[i.w,i]));
const SCHOOLIT=ITEMS.filter(i=>i.c==='school');
// krāsas; inv — nemainās (orange, marron, saliktās krāsas)
const COLORS=[
 {m:'rouge',f:'rouge',lv:'sarkans',h:'#e53935'},{m:'bleu',f:'bleue',lv:'zils',h:'#1e66f5'},
 {m:'vert',f:'verte',lv:'zaļš',h:'#2e9e44'},{m:'jaune',f:'jaune',lv:'dzeltens',h:'#fdd835'},
 {m:'noir',f:'noire',lv:'melns',h:'#262626'},{m:'blanc',f:'blanche',lv:'balts',h:'#ffffff'},
 {m:'orange',f:'orange',lv:'oranžs',h:'#fb8c00',inv:1},{m:'rose',f:'rose',lv:'rozā',h:'#f78fb3'},
 {m:'violet',f:'violette',lv:'violets',h:'#8e44ad'},{m:'gris',f:'grise',lv:'pelēks',h:'#9e9e9e'},
 {m:'marron',f:'marron',lv:'brūns',h:'#6d3f22',inv:1},{m:'beige',f:'beige',lv:'bēšs',h:'#d9b98c'},
 {m:'bleu ciel',f:'bleu ciel',lv:'gaiši zils',h:'#4fb3f0',inv:1,cmp:1},
 {m:'rouge foncé',f:'rouge foncé',lv:'tumši sarkans',h:'#8e1b1b',inv:1,cmp:1},
 {m:'vert clair',f:'vert clair',lv:'gaiši zaļš',h:'#a5dc8f',inv:1,cmp:1}];
const BASIC=COLORS.filter(c=>!c.cmp);
const EMO=[
 {m:'content',f:'contente',lm:'apmierināts',lf:'apmierināta',e:'😊'},
 {m:'triste',f:'triste',lm:'bēdīgs',lf:'bēdīga',e:'😢'},
 {m:'malade',f:'malade',lm:'slims',lf:'slima',e:'🤒'},
 {m:'fâché',f:'fâchée',lm:'dusmīgs',lf:'dusmīga',e:'😠'},
 {m:'fatigué',f:'fatiguée',lm:'noguris',lf:'nogurusi',e:'😫'}];
const PRON=[['je','es'],['tu','tu'],['il','viņš'],['elle','viņa'],['nous','mēs'],['vous','jūs'],['ils','viņi'],['elles','viņas']];
const APPEL={je:"m'appelle",tu:"t'appelles",il:"s'appelle",elle:"s'appelle",nous:'nous appelons',vous:'vous appelez',ils:"s'appellent",elles:"s'appellent"};
const NAMES={je:'Léa',tu:'Anna',il:'Carlos',elle:'Nadia',nous:'les Copains',vous:'Marie',ils:'Nan et Tibo',elles:'Mélodie et Anna'};
const LVSAUC={je:'Mani sauc',tu:'Tevi sauc',il:'Viņu sauc',elle:'Viņu sauc',nous:'Mūs sauc',vous:'Jūs sauc',ils:'Viņus sauc',elles:'Viņas sauc'};

/* --- vārdu formas --- */
// n = {it, p} — lieta un vai daudzskaitlī
const np=(it,p)=>({it,p:!!(p||it.onlyPl)});
const rndNP=(pool,plChance=.35)=>{const it=pick(pool);return np(it,Math.random()<plChance);};
const frN=n=>n.p?n.it.pl:n.it.w;
const UN=n=>n.p?'des':n.it.g==='m'?'un':'une';
const LE=n=>n.p?'les':n.it.g==='m'?'le':'la';
const MON=n=>n.p?'mes':n.it.g==='m'?'mon':'ma';
const PR=n=>n.p?(n.it.g==='m'?'Ils':'Elles'):(n.it.g==='m'?'Il':'Elle');
const EST=n=>n.p?'sont':'est';
const key=n=>n.it.g+(n.p?'pl':'');
const lvKey=n=>n.it.lg+(n.p?'pl':'');
const lvN=n=>n.p?n.it.lvpl:n.it.lv;
const LVDEM={m:'Tas',f:'Tā',mpl:'Tie',fpl:'Tās'};
const LVMANS={m:'mans',f:'mana',mpl:'mani',fpl:'manas'};
function lvAdj(lv,k){const ps=lv.split(' '),last=ps.pop();let f=last;if(last!=='rozā'){const st=last.replace(/(s|š)$/,'');f=k==='m'?last:k==='f'?st+'a':k==='mpl'?st+'i':st+'as';}return[...ps,f].join(' ');}
function colOf(c,n){if(c.inv)return c.m;const k=key(n);return k==='m'?c.m:k==='f'?c.f:k==='mpl'?(c.m.endsWith('s')?c.m:c.m+'s'):c.f+'s';}
function colForms(c){
  if(c.inv){if(c.cmp){const [a,...r]=c.m.split(' ');const fa=(CL[a]||{f:a+'e'}).f;return[c.m,[fa,...r].join(' '),c.m.split(' ').map(x=>x+'s').join(' ')];}return[c.m,c.m+'s',c.m+'e'];}
  const s=new Set([c.m,c.f,c.m.endsWith('s')?c.m:c.m+'s',c.f+'s']);if(!c.m.endsWith('e'))s.add(c.m+'e');if(c.m==='blanc')s.add('blance');if(c.m==='violet')s.add('violete');return[...s];}
const CL=Object.fromEntries(COLORS.map(c=>[c.m,c]));
const gcls=n=>n.p?'gp':n.it.g==='m'?'gm':'gf';
const glv=n=>(n.it.g==='m'?'vīriešu dzimte':'sieviešu dzimte')+(n.p?', daudzskaitlis':'');
const art=(a,n)=>`<span class="${gcls(n)}">${a} ${frN(n)}</span>`;

/* ============ zīmējumi ============ */
function shade(h,p){const n=parseInt(h.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.max(0,Math.min(255,Math.round(p<0?v*(1+p):v+(255-v)*p)));return'#'+[f(r),f(g),f(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const DEFCOL={sac:'#7b4a2d','sac à dos':'#e53935',livre:'#1e66f5',cahier:'#2e9e44',stylo:'#1e66f5',crayon:'#fdd835',feutre:'#e53935','taille-crayon':'#8e44ad',trousse:'#2e9e44',gomme:'#f78fb3',règle:'#fdd835',colle:'#ffffff',ciseaux:'#e53935',classe:'#f2d388',tableau:'#2f6b45','tableau interactif':'#bfe3ff',table:'#c48a52',chaise:'#1e66f5',corbeille:'#9e9e9e'};
function icon(w,c){
  c=c||DEFCOL[w];const d=shade(c,c==='#262626'?.35:-.28),o='#3a3346',S2=`stroke="${o}" stroke-width="3" stroke-linejoin="round"`;
  const g={
  sac:`<path d="M30 42 Q50 2 70 42" fill="none" stroke="${d}" stroke-width="6"/><rect x="16" y="38" width="68" height="48" rx="8" fill="${c}" ${S2}/><path d="M16 46 Q16 38 24 38 H76 Q84 38 84 46 V58 Q50 70 16 58 Z" fill="${d}" ${S2}/><circle cx="50" cy="61" r="4.5" fill="#ffd54f" ${S2}/>`,

const SK={voc:'Nosaucu skolas un klases lietas',col:'Nosaucu krāsas',gen:'Lietoju un / une / des, le / la / les',agr:'Saskaņoju krāsu ar lietvārdu',pos:'Lietoju mon / ma / mes',phr:'Saprotu un veidoju teikumus',emo:'Nosaucu emocijas',pro:'Vietniekvārdi un s\'appeler'};
const mc=(sk,kind,o)=>Object.assign({sk,kind,t:'mc'},o);
function optsWith(correct,wrongs,n=4){const w=shuffle([...new Set(wrongs)].filter(x=>x!==correct)).slice(0,n-1);const opts=shuffle([correct,...w]);return{opts,ans:opts.indexOf(correct)};}
const othersIt=(it,pool,k=3)=>shuffle(pool.filter(x=>x.w!==it.w)).slice(0,k);
const otherCols=(c,k=3,pool=COLORS)=>shuffle(pool.filter(x=>x.m!==c.m)).slice(0,k);
const expN=n=>`${art(UN(n),n)} — ${lvN(n)} (${glv(n)})`;
function agrExp(n,c){const f=colOf(c,n);let r=`${art(UN(n),n)} — ${glv(n)} → <b>${f}</b>. `;
  if(c.cmp)r+='Saliktās krāsas (bleu ciel, rouge foncé, vert clair) nemainās.';
  else if(c.inv)r+=`${c.m} nekad nemainās.`;
  else if(n.it.g==='f'&&c.m===c.f)r+=`${c.m} jau beidzas ar -e, tāpēc sieviešu dzimtē nemainās${n.p?', daudzskaitlī pieliek -s':''}.`;
  else if(n.it.g==='f'&&c.m==='blanc')r+=`blanc → blanche${n.p?'s':''} (īpašs gadījums).`;
  else if(n.it.g==='f'&&c.m==='violet')r+=`violet → violette${n.p?'s':''} (divi t).`;
  else if(n.it.g==='f')r+=`Sieviešu dzimtē pieliek -e${n.p?', daudzskaitlī vēl -s':''}: ${c.m} → ${f}.`;
  else if(n.p)r+=c.m.endsWith('s')?`${c.m} jau beidzas ar -s.`:'Daudzskaitlī pieliek -s.';
  else r+='Vīriešu dzimtē krāsa paliek pamatformā.';
  return r+' Krāsa ir <b>aiz</b> lietvārda.';}

const norm=s=>s.toLowerCase().replace(/[’`]/g,"'").replace(/[.!?]/g,'').replace(/\s+/g,' ').trim();
const noAcc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function renderQ(host,q,free,onDone){
  const card=el('div','task');host.appendChild(card);
  card.appendChild(el('div','kind',q.kind));
  if(q.sw)card.insertAdjacentHTML('beforeend',`<div class="swatch-big" style="background:${q.sw}"></div>`);
  if(q.pic)card.insertAdjacentHTML('beforeend',q.pic);
  const pr=el('div','prompt');pr.innerHTML=`<span>${q.q}</span>`;if(q.sayQ)pr.appendChild(sayBtn(q.sayQ));card.appendChild(pr);
  if(q.sayQ&&!free)setTimeout(()=>say(q.sayQ),250);
  const fb=el('div','fb');fb.style.display='none';
  let answered=false;
  const finish=(ok,note)=>{if(answered)return;answered=true;
    fb.style.display='';fb.className='fb '+(ok?'ok':'bad');
    fb.innerHTML=(ok?'✓ <b>'+pick(['Bravo !','Super !','Très bien !','Excellent !','Parfait !'])+'</b> ':'✗ <b>Pareizi:</b> <span class="fr">'+esc(q.say)+'</span> ')+(note?'<br>'+note:'')+(free&&ok?'':'<br>'+q.exp);
    fb.appendChild(sayBtn(q.say));if(ok||!free)say(q.say);
    onDone(ok);};
  if(q.t==='mc'){const g=el('div','opts');q.opts.forEach((o,i)=>{const b=el('button','opt',o);b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.disabled=true);
      if(i===q.ans){b.classList.add('right');finish(true);}else{b.classList.add('wrong');g.children[q.ans].classList.add('right');finish(false);}};g.appendChild(b);});card.appendChild(g);}
  else if(q.t==='sw'){const g=el('div','swopts');q.swatches.forEach((h,i)=>{const b=el('button','sw');b.style.background=h;b.setAttribute('aria-label','krāsa '+(i+1));b.onclick=()=>{if(answered)return;
      if(i===q.ans){b.classList.add('right');finish(true);}else{b.classList.add('wrong');g.children[q.ans].classList.add('right');finish(false);}};g.appendChild(b);});card.appendChild(g);}
  else if(q.t==='type'){const box=el('div','typebox');box.appendChild(el('span','pre',q.pre));const inp=el('input');inp.autocomplete='off';inp.autocapitalize='off';inp.spellcheck=false;inp.placeholder='…';box.appendChild(inp);card.appendChild(box);
    const ac=el('div','accents');['é','è','ê','à','â','ç','-',"'"].forEach(ch=>{const b=el('button','',ch);b.onclick=()=>{const p=inp.selectionStart??inp.value.length;inp.value=inp.value.slice(0,p)+ch+inp.value.slice(p);inp.focus();inp.setSelectionRange(p+1,p+1);};ac.appendChild(b);});card.appendChild(ac);
    const go=btn('Pārbaudīt ✓','primary',()=>{if(answered)return;let v=norm(inp.value);if(!v)return;const pre=norm(q.pre);if(v.startsWith(pre+' '))v=v.slice(pre.length+1);
      const a=norm(q.ans);inp.disabled=true;go.remove();
      if(v===a){inp.classList.add('okk');finish(true);}
      else if(noAcc(v)===noAcc(a)){inp.classList.add('okk');finish(true,`⚠️ Uzmanies uz akcentu: pareizi raksta <b>${esc(q.ans)}</b>.`);}
      else{inp.classList.add('bad');finish(false);}});
    inp.onkeydown=e=>{if(e.key==='Enter')go.click();};card.appendChild(go);setTimeout(()=>inp.focus(),50);}
  else if(q.t==='build'){const line=el('div','line'),bank=el('div','bank');const chosen=[];
    const draw=()=>{line.innerHTML='';if(!chosen.length)line.innerHTML='<span class="muted small" style="padding:0 6px">Spied uz vārdiem pareizā secībā…</span>';
      chosen.forEach((idx,k)=>{const b=el('button','wt',q.bank[idx]);b.onclick=()=>{if(answered)return;chosen.splice(k,1);bank.children[idx].classList.remove('used');draw();};line.appendChild(b);});};
    q.bank.forEach((w,idx)=>{const b=el('button','wt',w);b.onclick=()=>{if(answered||b.classList.contains('used'))return;chosen.push(idx);b.classList.add('used');draw();};bank.appendChild(b);});
    draw();card.append(line,bank);
    const go=btn('Pārbaudīt ✓','primary',()=>{if(answered||!chosen.length)return;go.remove();const v=chosen.map(i=>q.bank[i]).join(' ');finish(norm(v)===norm(q.words.join(' ')));});card.appendChild(go);}
  card.appendChild(fb);
  return card;
}

function practice(mode){
  clear();
  const isMist=mode==='mist',M=MODES[mode];
  topbar(isMist?'Kļūdu labošana':M.ico+' '+M.name);
  if(!isMist){const d=el('details','lesson');d.innerHTML='<summary>📖 Kā to dara?</summary>'+LESSON[mode];main.appendChild(d);}
  const N=isMist?Math.min(10,S.mist.length):10;
  const qs=isMist?S.mist.slice(0,N):Array.from({length:N},()=>G[pick(M.gens)]());
  let i=0,good=0;const host=el('div');main.appendChild(host);
  function next(){
    host.innerHTML='';
    if(i>=N){return finishRound();}
    const q=qs[i];
    host.insertAdjacentHTML('beforeend',`<div class="progress"><span>Jautājums ${i+1} / ${N}</span><span>✓ ${good}</span></div><div class="pbar"><i style="width:${i/N*100}%"></i></div>`);
    renderQ(host,q,false,ok=>{
      if(ok){good++;addStars(1);if(isMist)S.mist=S.mist.filter(x=>JSON.stringify(x)!==JSON.stringify(q));}
      else if(!isMist){S.mist.unshift(q);S.mist=S.mist.slice(0,40);}
      else{S.mist=S.mist.filter(x=>JSON.stringify(x)!==JSON.stringify(q));S.mist.push(q);}
      if(!isMist&&ok){S.stats[mode]=(S.stats[mode]||0)+1;}
      save();
      const a=el('div','actions');a.appendChild(btn(i<N-1?'Tālāk →':'Beigt raundu','primary',()=>{i++;next();}));host.lastChild.appendChild(a);
      a.querySelector('button').focus();});
  }
  function finishRound(){
    if(good===N){addStars(3);confetti(40);}
    const b=el('div','done');b.innerHTML=`<div class="big">${good} / ${N}</div><div>${good===N?'Parfait ! Bez kļūdām — vēl +3 ⭐ bonuss!':good>=7?'Très bien ! Vēl mazliet, un būs perfekti.':'Turpini trenēties — katru reizi sanāks labāk! 💪'}</div>`;
    host.appendChild(b);const a=el('div','actions');
    if(!isMist)a.appendChild(btn('Vēl vienu raundu ▶','primary',()=>practice(mode)));
    if(S.mist.length)a.appendChild(btn(`🔁 Labot kļūdas (${S.mist.length})`,'',()=>practice('mist')));
    a.appendChild(btn('Uz sākumu','',home));host.appendChild(a);
  }
  next();
}

function viewTest(){
  clear();topbar('📝 Formatīvā darba treniņš');
  const plan=['vocPic','vocPic','vocLvFr','vocClass','vocType','colSw','colSw','colLvFr','colFav','genUn','genUn','genLe','genLe','agrPhrase','agrPhrase','agrFill','agrType','posFill','posSent','posBuild','phrCest','phrColor','emoPick','emoLv'];
  // bez atkārtojumiem: katrai lietai/krāsai — cik iespējams dažādi
  const qs=[];const seen=new Set();plan.forEach(g=>{let q,t=0;do{q=G[g]();t++;}while(seen.has(q.q)&&t<20);seen.add(q.q);qs.push(q);});
  const host=el('div');main.appendChild(host);
  host.innerHTML=`<div class="hero">Kā stundā: <b>24 jautājumi</b> — skolas un klases lietas (5), krāsas (4), un / une / des un le / la / les (4), krāsas saskaņošana (4), mon / ma / mes (3), teikumi (2), emocijas (2). <b>Padomu nav</b>, katram jautājumam viens mēģinājums. Ja kaut ko aizmirsi — vispirms ieskaties <b>📖 Vārdnīcā</b>.</div>`;
  host.appendChild(btn('Sākt ▶','primary',run));
  let i=0;const res=[];
  function run(){
    host.innerHTML='';window.scrollTo(0,0);
    if(i>=qs.length)return summary();
    host.insertAdjacentHTML('beforeend',`<div class="progress"><span>Jautājums ${i+1} / ${qs.length}</span><span>${SK[qs[i].sk]}</span></div><div class="pbar"><i style="width:${i/qs.length*100}%"></i></div>`);
    renderQ(host,qs[i],true,ok=>{res[i]=ok;const a=el('div','actions');a.appendChild(btn(i<qs.length-1?'Tālāk →':'Rādīt rezultātu','primary',()=>{i++;run();}));host.lastChild.appendChild(a);});
  }
  function summary(){
    const pts=res.filter(Boolean).length,max=qs.length,pct=Math.round(pts/max*100);
    S.tests.push({date:new Date().toLocaleDateString('lv-LV'),pts,max});
    qs.forEach((q,j)=>{if(!res[j]&&!S.mist.some(x=>JSON.stringify(x)===JSON.stringify(q)))S.mist.unshift(q);});S.mist=S.mist.slice(0,40);
    save();addStars(pts);if(pct>=80)confetti(50);
    host.innerHTML='';
    host.insertAdjacentHTML('beforeend',`<div class="done"><div class="big">${pts} / ${max}</div><div><b>${pct}%</b> — ${pct>=90?'Excellent ! Esi gatava formatīvajam darbam! 🎉':pct>=70?'Très bien ! Atkārto to, kas tabulā dzeltens vai sarkans.':'Vēl jātrenējas — izmanto 🔁 Kļūdu labošanu un tēmu spēles.'}</div></div>`);
    const tag=(p,m)=>p===m?'<span class="tag g">Protu</span>':p*2>=m?'<span class="tag y">Protu daļēji</span>':'<span class="tag r">Vēl jāmācās</span>';
    const rows=Object.entries(SK).map(([k,n],idx)=>{const ix=qs.map((q,j)=>q.sk===k?j:-1).filter(j=>j>=0);const p=ix.filter(j=>res[j]).length;return `<tr><td>${idx+1}. ${n}</td><td class="c">${p}/${ix.length}</td><td>${tag(p,ix.length)}</td></tr>`;}).join('');
    const t=el('table','res');t.innerHTML='<tr><th>Prasme</th><th>Punkti</th><th></th></tr>'+rows;host.appendChild(t);
    const wrong=qs.filter((q,j)=>!res[j]);
    if(wrong.length){host.appendChild(el('p','',`Kļūdas: ${wrong.length}. Tās ieliku 🔁 Kļūdu labošanā — izspēlē tās vēlreiz!`));
      const ul=el('ul','small');wrong.forEach(q=>{const li=el('li');li.innerHTML=`${q.q} → <b class="fr">${esc(q.say)}</b>`;ul.appendChild(li);});host.appendChild(ul);}
    const a=el('div','actions');if(wrong.length)a.appendChild(btn('🔁 Labot kļūdas','primary',()=>practice('mist')));a.appendChild(btn('Vēlreiz','',viewTest));a.appendChild(btn('Uz sākumu','',home));host.appendChild(a);
  }
}

  const b=el('div','hero');b.innerHTML=`<p><b>Bonjour !</b> Šī spēle palīdz sagatavoties franču valodas 2. nodaļas <b>„À l'école”</b> formatīvajam darbam. Visi vārdi un teikumi ņemti no tavas burtnīcas.</p>
  <ul><li><b>📖 Vārdnīca</b> — visas skolas lietas un krāsas ar bildēm. Spied, lai dzirdētu izrunu.</li>

  <li>Krāsas burtiem: <span class="gm">zils — vīriešu dzimte</span>, <span class="gf">sarkans — sieviešu dzimte</span>, <span class="gp">violets — daudzskaitlis</span>.</li>

  <li>Kļūdas saglabājas <b>🔁 Kļūdu labošanā</b> — izspēlē tās, kamēr saraksts tukšs.</li>
  <li><b>📝 Formatīvā darba treniņš</b> — 24 jautājumi bez padomiem; beigās tabula „Protu / Protu daļēji / Vēl jāmācās”.</li>
  <li>🔊 augšā ieslēdz vai izslēdz skaņu.</li></ul>
  <p><b>Padoms:</b> 10 minūtes katru dienu ir labāk nekā stunda vienā vakarā. Bon courage ! 💪</p>`;

$('#home').onclick=home;
const sndBtn=$('#snd');const sndTxt=()=>sndBtn.textContent=S.sound?'🔊':'🔇';sndTxt();
sndBtn.onclick=()=>{S.sound=!S.sound;save();sndTxt();};
$('#stars').textContent='⭐ '+S.stars;
S.seen?home():viewHelp();
</script>
